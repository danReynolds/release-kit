name: Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          # Keep formatter output stable; functional tests use the current SDK.
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Native terminal qualification follows the full suite and real Homebrew
    # installation; slower macOS runners can need more than 15 minutes.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart test
        env:
          # The Homebrew install test changes the host's Homebrew, so it runs
          # only on CI's disposable macOS runners.
          RK_BREW_INSTALL_TEST: ${{ matrix.os == 'macos-latest' && '1' || '' }}
      - name: Qualify inline command flows
        run: |
          python3 -m venv .dart_tool/pty-env
          .dart_tool/pty-env/bin/pip install -r tool/tui-requirements.txt
          dart compile exe bin/rk.dart -o .dart_tool/rk-inline-check
          .dart_tool/pty-env/bin/python tool/check_installation_tui.py .dart_tool/rk-inline-check
          .dart_tool/pty-env/bin/python tool/check_installation_ux.py .dart_tool/rk-inline-check
          .dart_tool/pty-env/bin/python tool/check_status_tui.py .dart_tool/rk-inline-check
