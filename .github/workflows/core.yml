name: Core

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          # Keep formatter output stable; functional tests use the current SDK.
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Tests share one compiled rk. Each allowance bounds a hang well above a
    # normal run.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Compile rk once for every test that runs it
        run: dart compile exe bin/rk.dart -o .dart_tool/rk-ci
      # dart test runs half as many files at once as there are cores by
      # default: one on a three-core macOS runner.
      - run: dart test --exclude-tags publication --concurrency=4
        env:
          RK_TEST_EXECUTABLE: ${{ github.workspace }}/.dart_tool/rk-ci
          # The Homebrew install test changes the host's Homebrew, so it runs
          # only on CI's disposable macOS runners.
          RK_BREW_INSTALL_TEST: ${{ matrix.os == 'macos-latest' && '1' || '' }}
      - name: Qualify terminal command flows
        run: |
          python3 -m venv .dart_tool/pty-env
          .dart_tool/pty-env/bin/pip install -r tool/tui-requirements.txt
          .dart_tool/pty-env/bin/python tool/check_installation_tui.py .dart_tool/rk-ci
          .dart_tool/pty-env/bin/python tool/check_installation_ux.py .dart_tool/rk-ci

  native-macos:
    name: Native macOS bundles
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The temporary helper requires this exact SDK. Keep the main test
      # matrix on stable; remove this setup when the stock builder supports it.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - run: dart pub get
      - name: Install the pinned native-build helper
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 \
            https://github.com/danReynolds/release-kit/releases/download/dart-build-patch-3.13.5-1/rk-dart-build-3.13.5-1-macos-arm64.tar.gz \
            --output native-helper.tar.gz
          echo 'd6d703aacab40b2627beb6dec84cdd47e55915ba7e9f524415633b265d570d3e  native-helper.tar.gz' | shasum -a 256 --check
          tar -xzf native-helper.tar.gz
          echo "RK_DART_BUILD_TOOL=$RUNNER_TEMP/rk-dart-build-3.13.5-1-macos-arm64/rk-dart-build" >> "$GITHUB_ENV"
      - name: Exercise relocated release bundles and Local native commands
        run: dart test test/native_bundle_integration_test.dart test/installations/local_hooks_test.dart --concurrency=1 --reporter=expanded

  publication:
    name: Native publication qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - name: Exercise native publication and recovery locally
        run: dart test --tags publication --concurrency=1 --reporter=expanded
